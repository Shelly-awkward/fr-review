# 抓取請求佇列：任何 AI（或人）改 data_requests.json 並 push，本 workflow 讀檔抓取
# MOPS XBRL → 解析成 data/<co>_<year>Q<season>_pretrip.json → commit 回 repo。
#
# 為什麼是 push 觸發而不是 workflow_dispatch：
#   雲端 AI session 的 GitHub token 常無 workflow 權限（dispatch 會 403，實測），
#   但 push 一個 JSON 檔一定可以——這讓「改檔＋push」成為通用的抓取調度介面。
#
# 為什麼在 Actions 抓而不是 AI 端直連：雲端 AI 環境的網路政策封鎖 MOPS（實測）。
# 拋棄式 runner 上執行、無 LLM 參與、GITHUB_TOKEN 只能寫本 repo——來源內容即使
# 有問題也只是躺在 data/ 的文字資料，判讀端把它當不可信資料讀即可。
#
# 注意：MOPS WAF 對 GitHub runner IP 段間歇性封鎖；失敗就隔一陣子再 push 一次
# （改 data_requests.json 任意欄位即可重觸發），或在台灣 IP 本機跑
# python scripts/fetch_requests.py。
name: fetch-request
on:
  push:
    paths: [data_requests.json]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-request
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝依賴
        run: pip install requests

      - name: 依 data_requests.json 抓取
        run: python scripts/fetch_requests.py

      - name: Commit 資料
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "無新資料，跳過 commit"
          else
            git commit -m "自動抓取 MOPS XBRL 勤前包（$(date -u +%F)）"
            git pull --rebase origin main
            git push
          fi
